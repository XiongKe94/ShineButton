plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def siteUrl = 'https://github.com/XiongKe94/ShineButton'
def gitUrl = 'https://github.com/XiongKe94/ShineButton.git'
group = "com.github.xk"
version = "2.6"

android {
    namespace 'com.sackcentury.shinebuttonlib'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName "0.1.9"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'com.daasuu:EasingInterpolator:1.3.0'
}
