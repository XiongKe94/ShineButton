plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Maven Central 发布配置
ext {
    PUBLISH_GROUP_ID = 'com.github.xk'
    PUBLISH_ARTIFACT_ID = 'shinebutton'
    PUBLISH_VERSION = '3.0'
    PUBLISH_DESCRIPTION = 'This is a UI lib for Android. Effects like shining.'
    PUBLISH_URL = 'https://github.com/XiongKe94/ShineButton'
    PUBLISH_LICENSE_NAME = 'The MIT License (MIT)'
    PUBLISH_LICENSE_URL = 'https://raw.githubusercontent.com/XiongKe94/ShineButton/master/LICENSE'
    PUBLISH_DEVELOPER_ID = 'xiongke'
    PUBLISH_DEVELOPER_NAME = 'xiongke'
    PUBLISH_DEVELOPER_EMAIL = 'm15117937934@163.com'
}

group = PUBLISH_GROUP_ID
version = PUBLISH_VERSION

android {
    namespace 'com.sackcentury.shinebuttonlib'
    compileSdk 35

    defaultConfig {
        minSdk 15
        //noinspection OldTargetApi
        targetSdk 35
        versionName PUBLISH_VERSION
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'com.daasuu:EasingInterpolator:1.3.0'
}

// 应用 Maven Central 发布配置
apply from: rootProject.file('maven-publish.gradle')
